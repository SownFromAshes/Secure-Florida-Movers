<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Leave a review for Secure Florida Movers and share your experience with our moving services. We appreciate your feedback!">
    <title>Leave a Review | Secure Florida Movers</title>

    <!-- Core Site Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <!-- 
    /* ===============================================
       CUSTOM "CYBER GLOW" UI/UX STYLES
       - Built to the user's exact specifications.
       - Dark, high-contrast theme with vibrant accents.
       - All styles are self-contained for this page.
    =============================================== */
    -->
    <style>
        /* --- Page Body & Background --- */
        body {
            /* User-specified dark gradient background */
            background: linear-gradient(135deg, #0a0e1a 0%, #0f1222 100%);
            color: #E5E7EB; /* Default light text color for readability */
        }

        /* --- Main Content Wrapper --- */
        .review-page-wrapper {
            max-width: 750px;
            /* Adjusted margin: Increased top margin to create breathing room below the sticky navbar, matching the bottom margin. */
            margin: 8rem auto;
            padding: 0 1rem;
        }

        /* --- Form Container Card --- */
        .review-card {
            /* A semi-transparent dark background to sit atop the gradient */
            background: rgba(28, 31, 46, 0.7);
            border-radius: var(--border-radius-lg, 12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* Frosted glass effect */
            overflow: hidden;
        }

        /* --- Card Header --- */
        .review-card-header {
            padding: 2.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .review-card-header h1 {
            color: #FFFFFF; /* Bright white for the main heading */
            font-weight: 700;
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
        }

        .review-card-header p {
            color: #A9B1D6; /* A softer, secondary text color */
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- Form Body --- */
        .review-card-body {
            padding: 2.5rem;
        }

        /* --- Form Element Styling --- */
        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #A9B1D6;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 0.9rem 1.1rem;
            font-size: 1rem;
            font-family: var(--font-primary, 'Poppins', sans-serif);
            color: #E5E7EB;
            background-color: #0f1222; /* Dark input background */
            border: 1px solid #34384E; /* Subtle border */
            border-radius: var(--border-radius-md, 8px);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .form-control::placeholder {
            color: #5a607c;
        }

        .form-control:focus {
            outline: none;
            /* User-specified glowing border on focus */
            border-color: #00ff99;
            box-shadow: 0 0 10px -2px rgba(0, 255, 153, 0.5);
            background-color: #1C1F2E;
        }

        /* --- Elite Star Rating System --- */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-start;
            gap: 0.5rem;
        }
        .star-rating input[type="radio"] { display: none; }
        .star-rating label {
            font-size: 2.75rem;
            color: #34384E; /* Dark, subtle default state */
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease, transform 0.15s ease;
        }
        .star-rating label:hover {
            transform: scale(1.1);
        }
        .star-rating input[type="radio"]:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            /* Using the vibrant accent color for selected/hovered stars */
            color: #00ff99;
        }

        /* --- Submit Button --- */
        .btn-submit-review {
            width: 100%;
            /* User-specified vibrant gradient */
            background-image: linear-gradient(135deg, #00ff99, #00ccff);
            color: #0a0e1a; /* Dark text for contrast on the light button */
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700; /* Bolder text */
            letter-spacing: 0.5px;
            border-radius: var(--border-radius-md, 8px);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .btn-submit-review:hover {
            /* User-specified hover effect */
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -5px rgba(0, 255, 153, 0.25);
        }

    </style>
</head>

<body>

    <!-- Navbar Placeholder: Loaded by script.js -->
    <div id="navbar-placeholder"></div>

    <main>
        <div class="review-page-wrapper">
            <div class="review-card animate-fade-in-up">
                
                <div class="review-card-header">
                    <h1>Share Your Experience</h1>
                    <p>Your feedback is invaluable. It helps us improve and guides future customers in making the right choice.</p>
                </div>

                <div class="review-card-body">
                    <form action="https://formspree.io/f/manjodoo" method="POST">
                        
                        <div class="form-group">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="e.g., Jane Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Overall Rating</label>
                            <div class="star-rating">
                                <input type="radio" id="5-stars" name="rating" value="5" required/><label for="5-stars" title="5 stars">&#9733;</label>
                                <input type="radio" id="4-stars" name="rating" value="4" /><label for="4-stars" title="4 stars">&#9733;</label>
                                <input type="radio" id="3-stars" name="rating" value="3" /><label for="3-stars" title="3 stars">&#9733;</label>
                                <input type="radio" id="2-stars" name="rating" value="2" /><label for="2-stars" title="2 stars">&#9733;</label>
                                <input type="radio" id="1-star" name="rating" value="1" /><label for="1-star" title="1 star">&#9733;</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="review" class="form-label">Your Review</label>
                            <textarea id="review" name="review" rows="6" class="form-control" placeholder="Tell us about your moving experience..." required></textarea>
                        </div>

                        <button type="submit" class="btn-submit-review">Submit My Review</button>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer & Cookie Banner Placeholders: Loaded by script.js -->
    <div id="footer-placeholder"></div>
    <div id="cookie-banner-placeholder"></div>
    <script src="../assets/js/script.js" defer></script>

</body>
</html>
